<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AbsoluteScore</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08080d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 25px 0;
    }

    .header h1 {
      margin: 0;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .header p {
      color: #999;
      margin-top: 8px;
    }

    .card {
      background: #12121a;
      border: 1px solid #282833;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .upload {
      display: block;
      border: 2px dashed #555;
      border-radius: 15px;
      padding: 35px 15px;
      text-align: center;
      cursor: pointer;
      color: #ccc;
    }

    .upload:hover {
      border-color: #8b5cf6;
      color: #fff;
    }

    #imageInput {
      display: none;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #8b5cf6;
    }

    button:disabled {
      background: #333;
      color: #777;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .leaderboard-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .leaderboard-title h2 {
      margin: 0;
    }

    .team {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1b1b26;
      border: 1px solid #292936;
      border-radius: 12px;
      padding: 15px;
      margin-top: 9px;
    }

    .team-name {
      font-weight: bold;
      word-break: break-word;
    }

    .rank {
      display: inline-block;
      width: 35px;
      color: #999;
    }

    .score {
      font-size: 19px;
      font-weight: 900;
    }

    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #666;
    }

    .progress {
      width: 100%;
      height: 7px;
      background: #292933;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #8b5cf6;
      transition: width 0.2s;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>ABSOLUTESCORE</h1>
    <p>Automatic scoreboard calculator</p>
  </div>

  <div class="card">

    <label class="upload" for="imageInput">
      📸<br><br>
      <strong>UPLOAD SCOREBOARD PICTURES</strong>
      <br>
      <small>Select one or multiple images</small>
    </label>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      multiple
    >

    <div id="imageStatus" class="status">
      No images selected.
    </div>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <button id="calculateButton" onclick="calculateScores()">
      🧮 CALCULATE ABSOLUTE SCORES
    </button>

  </div>

  <div class="card">

    <div class="leaderboard-title">
      <h2>🏆 FINAL LEADERBOARD</h2>
    </div>

    <div id="leaderboard">
      <div class="empty">
        Upload scoreboard pictures to begin.
      </div>
    </div>

  </div>

</div>

<script>

const imageInput =
  document.getElementById("imageInput");

const imageStatus =
  document.getElementById("imageStatus");

const leaderboard =
  document.getElementById("leaderboard");

const progressBar =
  document.getElementById("progressBar");

const calculateButton =
  document.getElementById("calculateButton");


/*
  SHOW SELECTED IMAGES
*/

imageInput.addEventListener("change", () => {

  const count =
    imageInput.files.length;

  if (count === 0) {

    imageStatus.textContent =
      "No images selected.";

    return;
  }

  imageStatus.textContent =
    `${count} scoreboard image(s) selected.`;

});


/*
  OCR
*/

async function readImage(file, imageNumber, totalImages) {

  const result =
    await Tesseract.recognize(
      file,
      "eng",
      {
        logger: message => {

          if (
            message.status ===
            "recognizing text"
          ) {

            const percent =
              Math.round(
                message.progress * 100
              );

            const overall =
              Math.round(
                (
                  ((imageNumber - 1) * 100)
                  + percent
                ) / totalImages
              );

            progressBar.style.width =
              overall + "%";

            imageStatus.textContent =
              `Reading image ${imageNumber}/${totalImages} — ${percent}%`;

          }

        }
      }
    );

  return result.data.text;
}


/*
  CLEAN TEAM NAME
*/

function cleanTeamName(name) {

  return name
    .replace(/[|]/g, "")
    .replace(/[^\w\sÀ-ÿØøÆæƎƵƵƵ]/g, "")
    .replace(/\s+/g, " ")
    .trim();

}


/*
  EXTRACT TEAM + SCORE
*/

function extractScores(text) {

  const entries = [];

  const lines =
    text.split(/\r?\n/);

  for (let line of lines) {

    line = line.trim();

    if (!line) {
      continue;
    }

    /*
      Accept:

      TEAM 120
      TEAM - 120
      TEAM : 120
    */

    const match =
      line.match(
        /^(.+?)\s*(?:-|:)?\s*(\d{1,5})\s*$/
      );

    if (!match) {
      continue;
    }

    const team =
      cleanTeamName(match[1]);

    const score =
      Number(match[2]);

    if (
      !team ||
      Number.isNaN(score)
    ) {
      continue;
    }

    /*
      Prevent obvious OCR garbage.
    */

    if (score < 0 || score > 99999) {
      continue;
    }

    entries.push({
      team,
      score
    });

  }

  return entries;

}


/*
  NORMALIZE TEAM NAME
*/

function normalizeTeam(team) {

  return team
    .toUpperCase()
    .replace(/\s+/g, " ")
    .trim();

}


/*
  ABSOLUTE SCORE CALCULATOR
*/

function calculateAbsoluteScores(entries) {

  const seen =
    new Set();

  const totals =
    {};

  for (const entry of entries) {

    const team =
      entry.team.trim();

    const score =
      Number(entry.score);

    const normalizedTeam =
      normalizeTeam(team);

    /*
      IMPORTANT:

      Same TEAM + same SCORE
      is counted ONLY ONCE.

      Example:

      NXS MPZ — 120
      NXS MPZ — 120

      Only one 120 is counted.
    */

    const uniqueKey =
      normalizedTeam + "|" + score;

    if (seen.has(uniqueKey)) {
      continue;
    }

    seen.add(uniqueKey);

    if (!totals[normalizedTeam]) {

      totals[normalizedTeam] = {
        name: team,
        score: 0
      };

    }

    totals[normalizedTeam].score +=
      score;

  }

  return Object.values(totals)
    .sort(
      (a, b) =>
        b.score - a.score
    );

}


/*
  DISPLAY LEADERBOARD
*/

function displayLeaderboard(results) {

  leaderboard.innerHTML = "";

  if (results.length === 0) {

    leaderboard.innerHTML =
      `<div class="empty">
        No readable scores were found.
      </div>`;

    return;
  }

  results.forEach(
    (team, index) => {

      const row =
        document.createElement("div");

      row.className =
        "team";

      row.innerHTML = `
        <div class="team-name">
          <span class="rank">
            ${index + 1}.
          </span>

          ${escapeHTML(team.name)}
        </div>

        <div class="score">
          ${team.score}
        </div>
      `;

      leaderboard.appendChild(row);

    }
  );

}


/*
  PROTECT HTML OUTPUT
*/

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/*
  MAIN CALCULATOR
*/

async function calculateScores() {

  const files =
    Array.from(imageInput.files);

  if (files.length === 0) {

    alert(
      "Please upload scoreboard pictures first."
    );

    return;
  }

  calculateButton.disabled =
    true;

  leaderboard.innerHTML =
    `<div class="empty">
      🔎 Starting OCR...
    </div>`;

  progressBar.style.width =
    "0%";

  let allEntries = [];

  try {

    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      const text =
        await readImage(
          files[i],
          i + 1,
          files.length
        );

      console.log(
        "OCR TEXT:",
        text
      );

      const entries =
        extractScores(text);

      allEntries =
        allEntries.concat(entries);

    }

    progressBar.style.width =
      "100%";

    imageStatus.textContent =
      "Calculation complete.";

    const results =
      calculateAbsoluteScores(
        allEntries
      );

    displayLeaderboard(results);

  } catch (error) {

    console.error(error);

    leaderboard.innerHTML =
      `<div class="empty">
        ❌ Something went wrong while reading the images.
      </div>`;

    imageStatus.textContent =
      "OCR error. Check the browser console.";

  }

  calculateButton.disabled =
    false;

}

</script>

</body>
</html>
