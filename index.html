<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbsoluteScore V2</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      padding: 20px;
    }

    .app {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .card {
      background: #151520;
      border: 1px solid #29293a;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 18px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #20202c;
      color: white;
      border-radius: 10px;
      border: 1px solid #363648;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress {
      width: 100%;
      height: 10px;
      background: #29293a;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 15px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #a855f7;
      transition: width 0.2s;
    }

    #status {
      text-align: center;
      margin-top: 10px;
      color: #bbb;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #20202c;
      padding: 10px;
      border-radius: 9px;
      margin: 7px 0;
    }

    .score-row input {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border-radius: 7px;
      border: 1px solid #44445a;
      background: #11111a;
      color: white;
    }

    .score-row input.score {
      max-width: 100px;
    }

    .delete {
      width: auto;
      margin: 0;
      padding: 9px 12px;
      background: #dc2626;
    }

    .rank {
      width: 35px;
      font-weight: bold;
      color: #a855f7;
    }

    .team {
      flex: 1;
    }

    .points {
      font-weight: bold;
      color: #c084fc;
    }

    .leaderboard-row {
      display: flex;
      align-items: center;
      padding: 13px;
      margin: 7px 0;
      background: #20202c;
      border-radius: 10px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .small {
      color: #888;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>ABSOLUTESCORE</h1>
  <div class="subtitle">OCR Score Calculator</div>

  <div class="card">
    <h2>1. Upload Scoreboards</h2>

    <input
      type="file"
      id="images"
      accept="image/*"
      multiple
    />

    <button id="calculateBtn" onclick="calculateScores()">
      READ SCOREBOARDS
    </button>

    <div class="progress">
      <div class="bar" id="progressBar"></div>
    </div>

    <div id="status">Waiting for images...</div>

    <div class="small">
      Upload multiple screenshots. AbsoluteScore will detect team names and scores.
    </div>
  </div>


  <div class="card">
    <h2>2. Detected Scores</h2>

    <div id="detectedScores">
      <div class="empty">
        No scores detected yet.
      </div>
    </div>

    <button id="finalButton" onclick="calculateFinal()" disabled>
      CALCULATE ABSOLUTE SCORES
    </button>
  </div>


  <div class="card">
    <h2>3. Final Leaderboard</h2>

    <div id="leaderboard">
      <div class="empty">
        No leaderboard yet.
      </div>
    </div>
  </div>

</div>


<script>

let detectedEntries = [];


/* ================================
   IMAGE PREPROCESSING
================================ */

function preprocessImage(file) {

  return new Promise((resolve) => {

    const img = new Image();

    img.onload = function() {

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      /*
        Make small screenshots larger.
      */

      const scale = Math.max(
        2,
        Math.min(4, 1600 / img.width)
      );

      canvas.width = img.width * scale;
      canvas.height = img.height * scale;

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const imageData = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

      const data = imageData.data;

      /*
        Convert to grayscale and increase contrast.
      */

      for (let i = 0; i < data.length; i += 4) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        let gray =
          0.299 * r +
          0.587 * g +
          0.114 * b;

        /*
          Contrast
        */

        gray = ((gray - 128) * 1.5) + 128;

        gray = Math.max(
          0,
          Math.min(255, gray)
        );

        data[i] = gray;
        data[i + 1] = gray;
        data[i + 2] = gray;
      }

      ctx.putImageData(imageData, 0, 0);

      resolve(canvas.toDataURL("image/png"));
    };

    img.src = URL.createObjectURL(file);
  });
}


/* ================================
   NORMALIZE TEAM NAME
================================ */

function normalizeTeam(team) {

  return team
    .replace(/[|]/g, "I")
    .replace(/[^\w\sÀ-ÿØøÆæÐð]/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .toUpperCase();
}


/* ================================
   OCR LINE PARSER
================================ */

function extractScores(text) {

  const results = [];

  const lines = text.split("\n");

  for (let line of lines) {

    line = line
      .replace(/\r/g, "")
      .trim();

    if (!line) continue;

    /*
      Remove common scoreboard rank numbers.

      Example:

      1 NXS MPZ 120

      becomes:

      NXS MPZ 120
    */

    line = line.replace(
      /^\s*\d{1,3}[\.\)\-:\s]+/,
      ""
    );


    /*
      Find a score at the END of the line.

      Supports:

      NXS MPZ 120
      NXS MPZ - 120
      NXS MPZ : 120
      NXS MPZ | 120
    */

    const match = line.match(
      /^(.+?)\s*(?:[-:|])?\s*(\d{1,5})\s*$/
    );

    if (!match) continue;

    let team = match[1];
    let score = parseInt(match[2]);


    /*
      Ignore impossible scores.
    */

    if (
      !team ||
      isNaN(score) ||
      score < 0 ||
      score > 99999
    ) {
      continue;
    }


    team = normalizeTeam(team);

    /*
      Avoid extremely short OCR garbage.
    */

    if (team.length < 2) continue;


    results.push({
      team: team,
      score: score
    });
  }

  return results;
}


/* ================================
   OCR
================================ */

async function runOCR(image) {

  const result = await Tesseract.recognize(
    image,
    "eng",
    {
      logger: function(message) {

        if (message.status === "recognizing text") {

          const percent =
            Math.round(
              message.progress * 100
            );

          document.getElementById(
            "status"
          ).textContent =
            "Reading image... " +
            percent +
            "%";
        }
      }
    }
  );

  return result.data.text;
}


/* ================================
   UPLOAD + OCR
================================ */

async function calculateScores() {

  const input =
    document.getElementById("images");

  const files =
    Array.from(input.files);

  if (files.length === 0) {

    alert(
      "Upload at least one scoreboard image."
    );

    return;
  }


  const button =
    document.getElementById("calculateBtn");

  button.disabled = true;

  detectedEntries = [];


  for (let i = 0; i < files.length; i++) {

    document.getElementById(
      "status"
    ).textContent =
      "Processing image " +
      (i + 1) +
      " of " +
      files.length +
      "...";


    const progress =
      Math.round(
        (i / files.length) * 100
      );

    document.getElementById(
      "progressBar"
    ).style.width =
      progress + "%";


    try {

      const processed =
        await preprocessImage(
          files[i]
        );

      const text =
        await runOCR(processed);

      const entries =
        extractScores(text);

      detectedEntries.push(
        ...entries
      );

    } catch (error) {

      console.error(error);

      document.getElementById(
        "status"
      ).textContent =
        "Error reading image " +
        (i + 1);
    }
  }


  document.getElementById(
    "progressBar"
  ).style.width = "100%";


  button.disabled = false;

  displayDetectedScores();


  document.getElementById(
    "finalButton"
  ).disabled =
    detectedEntries.length === 0;


  document.getElementById(
    "status"
  ).textContent =
    "Finished. Review the detected scores.";
}


/* ================================
   DISPLAY DETECTED SCORES
================================ */

function displayDetectedScores() {

  const container =
    document.getElementById(
      "detectedScores"
    );

  container.innerHTML = "";


  if (detectedEntries.length === 0) {

    container.innerHTML =
      '<div class="empty">No scores detected.</div>';

    return;
  }


  detectedEntries.forEach(
    (entry, index) => {

      const row =
        document.createElement("div");

      row.className =
        "score-row";


      const number =
        document.createElement("div");

      number.className = "rank";

      number.textContent =
        index + 1;


      const team =
        document.createElement("input");

      team.value =
        entry.team;


      team.oninput = function() {

        detectedEntries[index].team =
          normalizeTeam(
            team.value
          );
      };


      const score =
        document.createElement("input");

      score.className = "score";

      score.type = "number";

      score.value =
        entry.score;


      score.oninput = function() {

        detectedEntries[index].score =
          parseInt(
            score.value
          ) || 0;
      };


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete";

      deleteButton.textContent =
        "X";


      deleteButton.onclick =
        function() {

          detectedEntries.splice(
            index,
            1
          );

          displayDetectedScores();
        };


      row.appendChild(number);

      row.appendChild(team);

      row.appendChild(score);

      row.appendChild(deleteButton);

      container.appendChild(row);
    }
  );
}


/* ================================
   ABSOLUTE SCORE CALCULATION
================================ */

function calculateFinal() {

  const totals = {};

  const seen = new Set();


  for (
    const entry of detectedEntries
  ) {

    const team =
      normalizeTeam(
        entry.team
      );

    const score =
      parseInt(
        entry.score
      );


    if (
      !team ||
      isNaN(score)
    ) {
      continue;
    }


    /*
      IMPORTANT:

      Same TEAM + same SCORE
      = counted only once.

      Example:

      NXS MPZ 120
      NXS MPZ 120

      Only one 120 is counted.

      But:

      NXS MPZ 120
      NXS MPZ 90

      = 210
    */

    const uniqueKey =
      team + "|" + score;


    if (
      seen.has(uniqueKey)
    ) {
      continue;
    }


    seen.add(uniqueKey);


    if (
      !totals[team]
    ) {
      totals[team] = 0;
    }


    totals[team] += score;
  }


  const leaderboard =
    Object.entries(totals)
      .sort(
        (a, b) =>
          b[1] - a[1]
      );


  displayLeaderboard(
    leaderboard
  );
}


/* ================================
   LEADERBOARD
================================ */

function displayLeaderboard(
  leaderboard
) {

  const container =
    document.getElementById(
      "leaderboard"
    );

  container.innerHTML = "";


  if (
    leaderboard.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">No scores.</div>';

    return;
  }


  leaderboard.forEach(
    (item, index) => {

      const team =
        item[0];

      const points =
        item[1];


      const row =
        document.createElement(
          "div"
        );

      row.className =
        "leaderboard-row";


      const rank =
        document.createElement(
          "div"
        );

      rank.className =
        "rank";

      rank.textContent =
        "#" + (index + 1);


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "team";

      name.textContent =
        team;


      const score =
        document.createElement(
          "div"
        );

      score.className =
        "points";

      score.textContent =
        points + " pts";


      row.appendChild(rank);

      row.appendChild(name);

      row.appendChild(score);


      container.appendChild(row);
    }
  );
}

</script>

</body>
</html>
